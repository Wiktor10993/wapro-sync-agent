# Przykładowa konfiguracja nginx dla Cloud Huba.
# DocumentRoot MUSI wskazywać na public/ — katalog storage/ z bazą SQLite
# leży poziom wyżej i nie może być osiągalny przez HTTP.

server {
    listen 443 ssl http2;
    server_name hub.twojafirma.pl;

    ssl_certificate     /etc/letsencrypt/live/hub.twojafirma.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.twojafirma.pl/privkey.pem;

    root /opt/wapro-hub/public;
    index index.php;

    client_max_body_size 16M;   # import CSV mapowań

    # Nagłówki bezpieczeństwa — panel serwuje HTML, API tylko JSON.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Pliki statyczne panelu
    location /assets/ {
        expires 7d;
        access_log off;
    }

    # Front controller
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Nagłówek Authorization bywa gubiony przez FastCGI
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Zmienne środowiskowe huba
        fastcgi_param HUB_DB_PATH            /var/lib/wapro-hub/hub.sqlite;
        fastcgi_param HUB_API_KEY_PEPPER     "ZMIEN_MNIE";
        fastcgi_param HUB_BL_WEBHOOK_SECRET  "ZMIEN_MNIE";
        fastcgi_param ALLEGRO_CLIENT_ID      "";
        fastcgi_param ALLEGRO_CLIENT_SECRET  "";
        fastcgi_param ALLEGRO_REDIRECT_URI   "https://hub.twojafirma.pl/oauth/allegro/callback";
        fastcgi_param BASELINKER_TOKEN       "";
        fastcgi_param BASELINKER_INVENTORY_ID "";
        fastcgi_param HUB_LOG_PATH           /var/log/wapro-hub/hub.log;
    }

    # Nic poza public/ nie jest serwowane, ale na wszelki wypadek:
    location ~ \.(sqlite|sqlite-wal|sqlite-shm|log|env)$ {
        deny all;
    }
}

server {
    listen 80;
    server_name hub.twojafirma.pl;
    return 301 https://$host$request_uri;
}
