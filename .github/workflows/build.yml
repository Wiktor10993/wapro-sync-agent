name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./desktop_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build & Publish Windows Installer
        # --publish always: electron-builder buduje instalator i wgrywa do GitHub
        # Releases KOMPLET plików wymaganych przez auto-update: .exe + latest.yml
        # + .blockmap. Provider „github" jest w package.json (build.publish).
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
