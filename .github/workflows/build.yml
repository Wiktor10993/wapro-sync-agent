name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./desktop_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Windows App & Installer
        # --publish never: budujemy tylko instalator; wgranie do Release robi
        # osobny krok poniżej. Bez tego electron-builder próbuje sam publikować
        # (bo package.json ma pole "repository") i wywala się na kroku publish.
        run: npm run build:win -- --publish never

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: 'desktop_agent/release/*.exe'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
