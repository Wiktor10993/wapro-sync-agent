<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Wapro ⇄ Allegro / BaseLinker — Agent</title>
    <!--
      CSP: renderer nie ładuje niczego z sieci.
      - 'unsafe-inline' dla stylów jest potrzebne Vite,
      - ws: w connect-src obsługuje hot-reload w trybie deweloperskim
        (w produkcji renderer i tak nie nawiązuje żadnych połączeń —
        cały ruch sieciowy idzie przez proces główny).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tło ustawione zanim wczyta się CSS — bez tego mignęłaby biała ramka. -->
    <style>
      html, body { background: #0f141a; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
